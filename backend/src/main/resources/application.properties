# ===== Server =====
server.port=8080

# ===== Database =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_marketplace?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:ROSHAN@EEC223}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:campus-marketplace-super-secret-key-that-is-at-least-256-bits-long-for-hs256}
app.jwt.expiration-ms=86400000

# ===== College Email Domain =====
app.college.email-domain=${COLLEGE_EMAIL_DOMAIN:@college.edu}

# ===== File Upload =====
app.upload.dir=${UPLOAD_DIRECTORY:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# ===== Mail (optional — app works without it) =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=${MAIL_ENABLED:false}

# ===== CORS =====
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ===== Admin Approval =====
app.listing.require-approval=${LISTING_REQUIRE_APPROVAL:false}

# ===== Data Seeder =====
app.seed.enabled=${SEED_ENABLED:true}
