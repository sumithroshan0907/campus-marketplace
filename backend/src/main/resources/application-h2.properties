# ===== Server =====
server.port=8080

# ===== Database (H2 In-Memory) =====
spring.datasource.url=jdbc:h2:mem:campus_marketplace;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=YEAR,USER,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== SQL Schema Initialization =====
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql

# ===== JPA / Hibernate =====
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ===== H2 Console =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JWT =====
app.jwt.secret=campus-marketplace-super-secret-key-that-is-at-least-256-bits-long-for-hs256
app.jwt.expiration-ms=86400000

# ===== College Email Domain =====
app.college.email-domain=@college.edu

# ===== File Upload =====
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# ===== CORS =====
app.cors.allowed-origins=http://localhost:5173

# ===== Admin Approval =====
app.listing.require-approval=false

# ===== Data Seeder =====
app.seed.enabled=true
